name: web-gobbler

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: goscrape
      POSTGRES_USER: goscrape
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goscrape -d goscrape"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: ${API_IMAGE}
    environment: &app_env
      PORT: "8080"
      DATABASE_URL: postgresql://goscrape:${POSTGRES_PASSWORD}@postgres:5432/goscrape
      REDIS_URL: redis://redis:6379
      API_KEY: ${API_KEY}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT}
      DEMO_MODE: ${DEMO_MODE}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS}
      DEMO_MAX_CRAWL_PAGES: ${DEMO_MAX_CRAWL_PAGES}
      JOB_RETENTION_MINUTES: ${JOB_RETENTION_MINUTES}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ${WORKER_IMAGE}
    environment: *app_env
    command: ["/app/worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-browser:
    image: ${BROWSER_IMAGE}
    environment:
      <<: *app_env
      RENDER_JS_ENABLED: "1"
      WORKER_CAPABILITY: browser
      BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE}
    shm_size: "2gb"
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    image: ${API_IMAGE}
    command: ["/app/migrate"]
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: https://${DOMAIN}/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
