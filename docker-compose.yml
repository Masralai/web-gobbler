services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: goscrape
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d goscrape"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://user:pass@postgres:5432/goscrape
      REDIS_URL: redis://redis:6379
      DEFAULT_TIMEOUT_SEC: "10"
      DEFAULT_MAX_RETRIES: "3"
      LOG_LEVEL: INFO
      API_RATE_LIMIT: "50"
      API_RATE_BURST: "200"
      # Optional P5: set in project .env or shell; empty → extract returns 501
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://user:pass@postgres:5432/goscrape
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: "5"
      DEFAULT_TIMEOUT_SEC: "10"
      DEFAULT_MAX_RETRIES: "3"
      SCRAPER_RATE_LIMIT: "2"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Optional JS-rendering worker: docker compose --profile browser up
  worker-browser:
    profiles: ["browser"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker-browser
    environment:
      DATABASE_URL: postgresql://user:pass@postgres:5432/goscrape
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: "2"
      DEFAULT_TIMEOUT_SEC: "30"
      DEFAULT_MAX_RETRIES: "2"
      SCRAPER_RATE_LIMIT: "1"
      RENDER_JS_ENABLED: "1"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./docker/grafana/dashboard.json:/etc/grafana/provisioning/dashboards/goscrape.json

  # Local AWS sandbox (Floci): docker compose --profile sandbox up -d floci
  floci:
    profiles: ["sandbox"]
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - floci_data:/app/data
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_HOSTNAME: floci
      FLOCI_SERVICES_ECR_URI_STYLE: path
      FLOCI_SERVICES_ECS_DOCKER_NETWORK: web-gobbler_default
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
  floci_data:
