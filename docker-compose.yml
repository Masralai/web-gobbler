services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: goscrape
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d goscrape"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://user:pass@postgres:5432/goscrape
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: "5"
      DEFAULT_TIMEOUT_SEC: "10"
      DEFAULT_MAX_RETRIES: "3"
      SCRAPER_RATE_LIMIT: "2"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
