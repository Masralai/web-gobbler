services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: goscrape
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d goscrape"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://user:pass@postgres:5432/goscrape
      REDIS_URL: redis://redis:6379
      DEFAULT_TIMEOUT_SEC: "10"
      DEFAULT_MAX_RETRIES: "3"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://user:pass@postgres:5432/goscrape
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: "5"
      DEFAULT_TIMEOUT_SEC: "10"
      DEFAULT_MAX_RETRIES: "3"
      SCRAPER_RATE_LIMIT: "2"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./docker/grafana/dashboard.json:/etc/grafana/provisioning/dashboards/goscrape.json

volumes:
  postgres_data:
